{% extends "!layout.html" %}
{% block extrahead %}
{{ super() }}
<script>
(function () {
  var root = document.documentElement;
  root.classList.add('desktop-sidebar-toggle-ready');
  try {
    if (window.localStorage.getItem('7e-sidebar-collapsed') === 'true') {
      root.classList.add('sidebar-collapsed');
    }
  } catch (error) {
    // Keep the toggle usable when browser storage is unavailable.
  }
})();
</script>
{% endblock %}
{% block navigation %}
{{ super() }}
<div class="wy-menu wy-menu-vertical" role="navigation">
  <ul>
    <li class="toctree-l1"><a class="reference internal" href="{{ pathto('genindex') }}">Acronym Glossary</a></li>
  </ul>
</div>
{% endblock %}
